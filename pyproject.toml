[project]
name = "certsentry"
version = "0.0.1"
description = "Async CLI that audits TLS certificates across many domains. Early development."
readme = "README.md"
authors = [
    { name = "Eric Harris", email = "ericktheredd5875@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
certsentry = "certsentry.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "trustme>=1.2.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "ASYNC", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live' --strict-markers"
markers = ["live: hits real hosts on the internet (opt in with -m live)"]

[tool.coverage.run]
source = ["certsentry"]
branch = true
omit = ["src/certsentry/__main__.py"]

[tool.coverage.report]
show_missing = true
